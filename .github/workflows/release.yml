name: release

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.maxDuration=10s" \
              -o dist/fireworks-linux-$arch .
          done
          cd dist && sha256sum fireworks-linux-* > SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "Automated build of ${GITHUB_SHA}" \
            --latest
